<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contributing to NodeGSM</title>
<meta name="description" content="How to add or fix a game plugin for NodeGSM with a pull request.">
<meta name="theme-color" content="#05060d">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contributing">
<main>
<div class="ph wrap"><h1>Contributing <span class="grad">guide</span></h1>
  <p>Add a game or fix an outdated one with a pull request.</p>
  <div class="cta" style="margin-top:22px"><a class="btn primary" id="repo" href="#" target="_blank" rel="noopener">Open the Catalogue repository</a><a class="btn" href="plugins.html">Browse plugins</a></div></div>
<section style="padding-top:18px"><div class="wrap"><div class="card md" id="doc" style="max-width:860px;margin:0 auto">Loading...</div></div></section>
</main>
<script src="config.js"></script>
<script src="layout.js"></script>
<script>
(async () => {
  const C = window.NODEGSM_SITE; const R = C.CATALOGUE_REPO;
  document.getElementById('repo').href = R;
  try {
    const src = await fetch('data/contributing.md').then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); });
    // links in the markdown are relative to the Catalogue repository: make them absolute
    const abs = src.replace(/\]\((?!https?:)([^)\s]+)\)/g, (m, u) => {
      u = u.replace(/^(\.\.\/)+/, '');
      return '](' + R + (/^(issues|pulls)/.test(u) ? '/' : (/\/$/.test(u) || !/\./.test(u) ? '/tree/main/' : '/blob/main/')) + u + ')';
    });
    document.getElementById('doc').innerHTML = $md(abs);
  } catch (e) { document.getElementById('doc').innerHTML = '<p>Could not load the guide. <a href="' + R + '/blob/main/CONTRIBUTING.md">Read it on GitHub</a>.</p>'; }
})();
</script>
</body>
</html>
