<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NodeGSM Activity Feed</title>
<meta name="description" content="What is happening on NodeGSM: new and updated plugins, ratings, comments, community edits and downloads.">
<meta name="theme-color" content="#05060d">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="feed">
<main>
<div class="ph wrap"><h1>Activity <span class="grad">Feed</span> 📰</h1>
  <p>New and updated plugins, ratings, comments, community edits and downloads, as they happen.</p></div>
<div class="toolbar"><div class="wrap">
  <div class="chips" id="chips" style="margin-top:0"></div>
  <p class="mute" id="totals" style="font-size:.85rem;margin:10px 0 0"></p>
</div></div>
<section style="padding-top:18px"><div class="wrap feed-cols">
  <ul class="feed" id="feed"><li class="mute">Loading activity...</li></ul>
  <aside><div class="card"><h3 style="margin-top:0">Most downloaded</h3><ol class="top" id="top"><li class="mute">Loading...</li></ol></div></aside>
</div></section>
</main>
<script src="config.js"></script>
<script src="layout.js"></script>
<script src="community.js"></script>
<script src="feed.js"></script>
</body>
</html>
