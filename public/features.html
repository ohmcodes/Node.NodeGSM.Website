<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NodeGSM Features and Changelog</title>
<meta name="description" content="Everything NodeGSM can do, what is still planned, and the full changelog. Generated from FEATURES.md.">
<meta name="theme-color" content="#05060d">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="features">
<main>
<div class="ph wrap"><h1><span class="grad">Features</span> &amp; changelog</h1>
  <p>This page is generated from the project's <code>FEATURES.md</code>, so it always matches the app. <span class="mute">✅ done · 🧪 done, not tested on a real server · ⏳ planned</span></p></div>
<section style="padding-top:28px"><div class="wrap">
  <div class="search" style="max-width:560px;margin:0 auto 28px"><input class="in" id="f" placeholder="Filter features..."></div>
  <div id="groups"><div class="empty">Loading...</div></div>
</div></section>
<section id="changelog"><div class="wrap">
  <div class="sec-h"><h2>Change<span class="grad">log</span></h2><p>Newest first.</p></div>
  <div class="log" id="log"></div>
</div></section>
</main>
<script src="config.js"></script>
<script src="layout.js"></script>
<script>
(async () => {
  let s; try { s = await $json('data/site.json'); } catch (e) { document.getElementById('groups').innerHTML = '<div class="empty">Run <code>npm run sync:app</code> to generate the data.</div>'; return; }
  const draw = (q) => {
    document.getElementById('groups').innerHTML = s.groups.map((g) => {
      const rows = g.rows.filter((r) => !q || (r.feature + r.notes).toLowerCase().includes(q)); if (!rows.length) return '';
      return `<div class="card" style="margin-bottom:18px"><h3>${$esc(g.group)} <span class="mute" style="font-weight:400">· ${rows.length}</span></h3><div class="scroll"><table class="tbl"><tr><th>Feature</th><th>Status</th><th>Notes</th></tr>${rows.map((r) => `<tr><td>${$inline(r.feature)}</td><td><span class="st">${$esc(r.status)}</span></td><td class="mute">${$inline(r.notes)}</td></tr>`).join('')}</table></div></div>`;
    }).join('') || '<div class="empty">No feature matches.</div>';
  };
  draw(''); document.getElementById('f').oninput = (e) => draw(e.target.value.toLowerCase());
  document.getElementById('log').innerHTML = s.changelog.map((e) => `<div class="e"><h3>${$inline(e.title)}</h3><ul>${e.items.map((i) => `<li>${$inline(i)}</li>`).join('')}</ul></div>`).join('');
})();
</script>
</body>
</html>
